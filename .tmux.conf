#fix colors
set-option -sa terminal-overrides ",xterm*:Tc"
# add mouse support
set -g mouse on

# bind prefix to control space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Custom binings
bind -n M-H previous-window
bind -n M-L next-window

# set zsh to default shell
set-option -g default-shell /home/lorenz.hohermuth/.nix-profile/bin/zsh

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

#Tmux Yank
set -g @yank_selection_mouse 'clipboard' # or 'primary' or 'secondary'
set -g @yank_selection 'primary' # or 'secondary' or 'clipboard'
set -g @yank_with_mouse on
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

#Catppuccin 
run ~/.tmux/plugins/tmux/catppuccin.tmux

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "custom"

set -g @catppuccin_window_current_text_color "fg=#{@thm_mauve},bg=#{@thm_mauve}"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"

set -g @catppuccin_window_text_color "fg=#{@thm_surface_1},bg=#{@thm_surface_1}"
set -g @catppuccin_window_number_color "#{@thm_surface_1}"

#set -g @catppuccin_window_status_enable "no"
#set -g @catppuccin_window_status_icon_enable "yes"
#
set -g @catppuccin_window_middle_separator "/"
set -gq @catppuccin_window_left_separator "#[fg=#{@_ctp_status_bg},reverse]█#[none]"
set -gq @catppuccin_window_right_separator "#[fg=#{@_ctp_status_bg},reverse]█#[none]"

set -g @catppuccin_window_current_middle_separator "/"
set -gq @catppuccin_window_current_left_separator "#[fg=#{@_ctp_status_bg},reverse]█#[none]"
set -gq @catppuccin_window_current_right_separator "#[fg=#{@_ctp_status_bg},reverse]█#[none]"
#
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number "#I "
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_number "#I "


set -g @catppuccin_status_left_separator  "█"
set -g @catppuccin_status_right_separator "█"
#set -g @catppuccin_status_right_separator_inverse "no"
#set -g @catppuccin_status_fill "icon"
#set -g @catppuccin_status_connect_separator "no"
#set -g @catppuccin_status_modules_right "application session user"


set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_user}"

run ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux
run ~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery.tmux


run '~/.tmux/plugins/tpm/tpm'

# Open panes in current dir
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

unbind C-n
unbind n
unbind C-p
unbind p
bind-key -r n new-window -c "#{pane_current_path}"

bind-key -r i run-shell "tmux neww ~/dotfiles/cht.sh"
bind-key -r e run-shell "tmux neww ranger #{pane_current_path}"

#Info
run-shell 'echo reloaded .tmux.conf ...'
